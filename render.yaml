# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: smartride-admin
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.18.0
      - key: API_ORIGIN
        value: https://sinyongtaxi-i7e5.onrender.com
